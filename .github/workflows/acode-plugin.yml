name: Build Qich Acode Plugin

on:
  push:
    paths:
      - "integrations/acode/**"
      - ".github/workflows/acode-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate plugin manifest
        run: python -m json.tool integrations/acode/plugin.json > /dev/null
      - name: Check JavaScript syntax
        run: node --check integrations/acode/main.js
      - name: Package plugin
        run: python integrations/acode/package_plugin.py
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: qich-acode-plugin
          path: integrations/acode/dist/qich-acode-plugin.zip
          if-no-files-found: error

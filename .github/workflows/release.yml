name: Qich Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Python tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run Qich language tests
        env:
          PYTHONPATH: src
        run: python -m qich test
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Install and smoke-test built wheel
        run: |
          python -m venv /tmp/qich-release-venv
          /tmp/qich-release-venv/bin/python -m pip install dist/*.whl
          /tmp/qich-release-venv/bin/qh --version
          /tmp/qich-release-venv/bin/qh bridges
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
